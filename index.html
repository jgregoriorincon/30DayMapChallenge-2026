<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<base target="_blank">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#30DayMapChallenge 2026 · RustGIS</title>
<meta name="description" content="30 mapas de Colombia y sus ciudades hechos con RustGIS en el navegador, por José Gregorio Rincón Albarracín. 30 maps of Colombia and its cities made with RustGIS in the browser.">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --text: #1d1f22;
    --muted: #5f6670;
    --line: #e2ded5;
    --accent: #0b6e69;
    --accent-text: #ffffff;
    --placeholder: #ebe7de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --surface: #1b1e22;
      --text: #e9e7e2;
      --muted: #a2a8b0;
      --line: #2c3036;
      --accent: #35c2b8;
      --accent-text: #0d1513;
      --placeholder: #23272c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.15; letter-spacing: -0.01em; }
  .lead { margin: 8px 0 0; max-width: 60ch; color: var(--muted); }
  .lead a, .byline a, footer a { color: var(--accent); }
  .byline { margin: 10px 0 0; max-width: 60ch; font-size: 0.95rem; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang button {
    border: 0; background: transparent; color: var(--muted); padding: 6px 14px; font: inherit;
    font-size: 0.9rem; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 32px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 210 / 297; background: var(--placeholder); display: grid; place-items: center; color: var(--muted); font-size: 0.9rem; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .meta { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .card h2 { margin: 0; font-size: 1.1rem; line-height: 1.3; }
  .data { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 10px; }
  .links a {
    font-size: 0.85rem; text-decoration: none; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--line); color: var(--text);
  }
  .links a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .links a:focus-visible, .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>#30DayMapChallenge 2026</h1>
      <p class="lead" data-i18n="lead"></p>
      <p class="byline" data-i18n="byline"></p>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
  <footer data-i18n="footer"></footer>
</div>
<script>
  // Los días publicados. Al publicar uno: subir results/day-NN/day-NN.rgis, day-NN-{es,en}.{webp,pdf} y scripts/day-NN/ y añadirlo aquí.
  const DAYS = [
    { n: 1, theme: "Points",
      title: { es: "Los gigantes de Bogotá", en: "Bogotá's giants" },
      data: { es: "Censo del arbolado urbano, JBB / IDECA (CC BY 4.0)", en: "Urban tree census, JBB / IDECA (CC BY 4.0)" } },
    { n: 2, theme: "Lines",
      title: { es: "Bogotá en bicicleta", en: "Bogotá by bike" },
      data: { es: "Red Biciusuarios, IDU / IDECA (CC BY 4.0)", en: "Bike lane network, IDU / IDECA (CC BY 4.0)" } },
    { n: 3, theme: "Polygons",
      title: { es: "Barranquilla, manzana por manzana", en: "Barranquilla, block by block" },
      data: { es: "Estrato por manzana 2018, Esri Colombia con datos del DANE; límite, IGAC", en: "Socioeconomic stratum per block 2018, Esri Colombia from DANE data; boundary, IGAC" } },
    { n: 4, theme: "Clusters",
      title: { es: "Los puntos negros de Bogotá", en: "Bogotá's black spots" },
      data: { es: "Siniestros viales con muertos 2016–2025, Secretaría Distrital de Movilidad (SIMUR)", en: "Fatal road crashes 2016–2025, Bogotá Mobility Department (SIMUR)" } },
    { n: 5, theme: "Senses: Sight",
      title: { es: "¿Qué se ve desde Monserrate?", en: "What can you see from Monserrate?" },
      data: { es: "Modelo Digital de Terreno de Bogotá 2025, IDECA (CC BY 4.0)", en: "Digital Terrain Model of Bogotá 2025, IDECA (CC BY 4.0)" } },
    { n: 6, theme: "Vintage",
      title: { es: "Cartagena de Indias, según Herrera", en: "Cartagena de Indias, as Herrera drew it" },
      data: { es: "Plano de Juan de Herrera, BnF / Gallica (dominio público); © colaboradores de OpenStreetMap (ODbL)", en: "Plan by Juan de Herrera, BnF / Gallica (public domain); © OpenStreetMap contributors (ODbL)" } },
    { n: 7, theme: "10 minute map",
      title: { es: "Una tarde de nubes sobre Colombia", en: "An afternoon of clouds over Colombia" },
      data: { es: "NOAA GOES-East ABI GeoColor (CIRA/NOAA), vía NASA GIBS; límite, geoBoundaries (CC0)", en: "NOAA GOES-East ABI GeoColor (CIRA/NOAA), via NASA GIBS; boundary, geoBoundaries (CC0)" } },
    { n: 8, theme: "Utopia",
      title: { es: "La utopía del 3-30-300 en Medellín", en: "The 3-30-300 utopia in Medellín" },
      data: { es: "Alcaldía de Medellín, GeoMedellín (CC BY-SA 4.0): ortofoto 2024, manzanas, espacio público y comunas. Este mapa y su proyecto: CC BY-SA 4.0", en: "Alcaldía de Medellín, GeoMedellín (CC BY-SA 4.0): 2024 orthophoto, city blocks, public space and comunas. This map and its project: CC BY-SA 4.0" } },
    { n: 9, theme: "Urban-rural",
      title: { es: "¿Dónde termina la ciudad?", en: "Where does the city end?" },
      data: { es: "DANE, grilla estadística de 1 km con el grado de urbanización (Censo 2018); Área Metropolitana de Bucaramanga, perímetros urbanos; mapa base: OpenFreeMap Positron, © OpenMapTiles / © OpenStreetMap (ODbL); colores: GHSL. Este mapa y su proyecto: CC BY 4.0", en: "DANE, 1 km statistical grid with the degree of urbanisation (2018 Census); Bucaramanga Metropolitan Area, urban perimeters; basemap: OpenFreeMap Positron, © OpenMapTiles / © OpenStreetMap (ODbL); colours: GHSL. This map and its project: CC BY 4.0" } },
    { n: 10, theme: "Prompting only", prompts: true,
      title: { es: "La mitad de Colombia vive en 27 municipios", en: "Half of Colombia lives in 27 municipalities" },
      data: { es: "DANE, Censo Nacional de Población y Vivienda 2018 (población por municipio) y Marco Geoestadístico Nacional 2025 (límites municipales). Hecho solo con prompts, con Claude Code manejando RustGIS de escritorio. Este mapa y su proyecto: CC BY 4.0", en: "DANE, 2018 National Population and Housing Census (population by municipality) and 2025 National Geostatistical Framework (municipal boundaries). Made with prompts only, with Claude Code driving RustGIS desktop. This map and its project: CC BY 4.0" } },
    { n: 11, theme: "Senses: Sound",
      title: { es: "¿Dónde no duerme Bogotá?", en: "Where Bogotá can't sleep" },
      data: { es: "Secretaría Distrital de Ambiente, Mapas Estratégicos de Ruido de Bogotá 2018-2021, nocturno, jornada ordinaria (CC BY 4.0); mapa base: Mapa base azul, IDECA. Este mapa y su proyecto: CC BY 4.0", en: "Bogotá District Environment Department (SDA), Strategic Noise Maps of Bogotá 2018-2021, night, ordinary days (CC BY 4.0); basemap: Mapa base azul, IDECA. This map and its project: CC BY 4.0" } },
    { n: 12, theme: "Power",
      title: { es: "El sol llegó tarde, y de golpe", en: "The sun came late, and all at once" },
      data: { es: "UPME, Geoportal: plantas de generación (con datos de XM) y líneas de transmisión, consultado el 2026-11-11 (sin licencia declarada; la UPME los presenta como informativos y aproximados); departamentos: DANE, MGN 2025; mapa base: Midnight de RustGIS", en: "UPME Geoportal: power plants (with XM data) and transmission lines, accessed 2026-11-11 (no licence declared; UPME presents them as indicative and approximate); departments: DANE, MGN 2025; basemap: RustGIS Midnight" } },
  ];

  const BASE = "https://jgregoriorincon.github.io/30DayMapChallenge-2026/";
  const T = {
    es: {
      lead: 'Mapas de Colombia y de sus ciudades (Bogotá, Barranquilla, Cartagena, Medellín, Bucaramanga, Cali y Cúcuta) hechos de principio a fin con <a href="https://github.com/opengeos/RustGIS">RustGIS</a> en el navegador, con datos de servicios públicos. Cada proyecto se abre en web.rustgis.app tal como se ve en la imagen.',
      byline: 'Por <a href="https://github.com/jgregoriorincon">José Gregorio Rincón Albarracín</a>, arquitecto de soluciones geográficas y contribuidor de RustGIS · <a href="https://www.linkedin.com/in/jgregoriorincon/">LinkedIn</a>',
      day: "Día", open: "Abrir en RustGIS", image: "Imagen", s1: "Datos", s2: "Vista", s3: "Layout", s4: "Layout EN", prompts: "Los prompts",
      pending: "Imagen pendiente", data: "Datos",
      footer: 'Imágenes y proyectos: CC BY 4.0, @jgregoriorincon, salvo el día que indique otra licencia. Scripts y galería: MIT. Los datos conservan la licencia de su fuente. <a href="https://github.com/jgregoriorincon/30DayMapChallenge-2026/blob/main/README.es.md">Cómo reproducir cada día</a>.',
    },
    en: {
      lead: 'Maps of Colombia and its cities (Bogotá, Barranquilla, Cartagena, Medellín, Bucaramanga, Cali and Cúcuta) made end to end with <a href="https://github.com/opengeos/RustGIS">RustGIS</a> in the browser, from public web services. Each project opens in web.rustgis.app exactly as in the image. Each map comes in Spanish and in English.',
      byline: 'By <a href="https://github.com/jgregoriorincon">José Gregorio Rincón Albarracín</a>, GIS solutions architect and RustGIS contributor · <a href="https://www.linkedin.com/in/jgregoriorincon/">LinkedIn</a>',
      day: "Day", open: "Open in RustGIS", image: "Image", s1: "Data", s2: "View", s3: "Layout", s4: "English layout", prompts: "The prompts",
      pending: "Image coming soon", data: "Data",
      footer: 'Images and projects: CC BY 4.0, @jgregoriorincon, unless a day states another licence. Scripts and gallery: MIT. The data keeps its source\'s licence. <a href="https://github.com/jgregoriorincon/30DayMapChallenge-2026/blob/main/README.md">How to reproduce each day</a>.',
    },
  };

  // Idioma: ?lang= en la URL, luego la elección guardada, luego el idioma del navegador.
  function pickLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "es" || q === "en") return q;
    try {
      const saved = localStorage.getItem("lang");
      if (saved === "es" || saved === "en") return saved;
    } catch (_) {}
    const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    return langs.some(l => String(l).toLowerCase().startsWith("es")) ? "es" : "en";
  }

  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function render(lang) {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t[el.dataset.i18n]; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    document.getElementById("grid").innerHTML = DAYS.map(d => {
      const dir = "day-" + pad(d.n);
      const out = "results/" + dir + "/" + dir;
      const img = out + "-" + lang;
      const title = esc(d.title[lang]);
      return `<article class="card">
        <a class="thumb" href="${img}.webp" aria-label="${t.image}: ${title}">
          <img src="${img}.webp" alt="${title}" loading="lazy" onerror="this.parentNode.textContent='${t.pending}'">
        </a>
        <div class="body">
          <div class="meta">${t.day} ${d.n} · ${esc(d.theme)}</div>
          <h2>${title}</h2>
          <p class="data">${t.data}: ${esc(d.data[lang])}</p>
          <div class="links">
            <a class="primary" data-open="${pad(d.n)}" href="https://web.rustgis.app/?project=${BASE}${out}.rgis">${t.open}</a>
            <a href="${img}.pdf">PDF</a>
            ${d.prompts
              ? `<a href="https://github.com/jgregoriorincon/30DayMapChallenge-2026/blob/main/scripts/${dir}/01-prompts.md">${t.prompts}</a>`
              : `<a href="scripts/${dir}/01-data.txt">1 · ${t.s1}</a>
            <a href="scripts/${dir}/02-view.txt">2 · ${t.s2}</a>
            <a href="scripts/${dir}/03-layout.txt">3 · ${t.s3}</a>
            <a href="scripts/${dir}/04-english.txt">4 · ${t.s4}</a>`}
          </div>
        </div>
      </article>`;
    }).join("");
  }

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    try { localStorage.setItem("lang", b.dataset.lang); } catch (_) {}
    render(b.dataset.lang);
  }));
  render(pickLang());

  // Cuenta en GoatCounter cada clic en "Abrir en RustGIS". Delegado en #grid porque
  // render() reemplaza las tarjetas al cambiar de idioma. Si GoatCounter está bloqueado, no hace nada.
  function countOpen(e) {
    if (e.type === "auxclick" && e.button !== 1) return;
    const a = e.target.closest("a[data-open]");
    const gc = window.goatcounter;
    if (!a || !gc || typeof gc.count !== "function") return;
    gc.count({ path: "abrir-rustgis/day-" + a.dataset.open, title: "Abrir en RustGIS · día " + a.dataset.open, event: true });
  }
  const grid = document.getElementById("grid");
  grid.addEventListener("click", countOpen);
  grid.addEventListener("auxclick", countOpen);
</script>
<script data-goatcounter="https://jgregoriorincon.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
